name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node == 'nvmrc' && 'from .nvmrc' || matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # "nvmrc" uses the pinned version in .nvmrc (the one contributors use locally).
        node: [nvmrc, 24]
        include:
          - os: macos-latest
            node: nvmrc
          - os: windows-latest
            node: nvmrc
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node != 'nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'nvmrc' && '.nvmrc' || '' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers for browser tests
        run: npx playwright install --with-deps --only-shell chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Doctor
        run: node bin/launchscope.js doctor

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
