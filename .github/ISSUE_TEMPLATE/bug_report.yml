name: Bug report
description: Something in LaunchScope is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste tokens, cookies, or private hostnames.**
        For security issues, use [private reporting](https://github.com/himan-patel/launchscope/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: LaunchScope version
      description: Output of `launchscope --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.12.0, macOS 15
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, with secrets removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the terminal output (re-run with `--verbose` if possible).
    validations:
      required: true
